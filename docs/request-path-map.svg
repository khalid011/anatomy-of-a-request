<svg viewBox="0 0 1180 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram: a client sends a request to a web server (Nginx), which either serves a static file directly or forwards the request to an application server (Spring Boot, using an embedded Tomcat and Hibernate/JPA). The application server queries a database (Postgres) and returns rows. The response traverses back through the application server and web server to the client as JSON.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B45A1F"></path>
    </marker>
    <marker id="arrow-return" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8FA0AF"></path>
    </marker>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F1720" flood-opacity="0.10"></feDropShadow>
    </filter>
  </defs>

  <rect x="0" y="0" width="1180" height="480" fill="#FBFAF8"></rect>

  <text x="40" y="44" font-family="'IBM Plex Sans','Segoe UI',sans-serif" font-size="20" font-weight="700" fill="#16212C">One request, four roles</text>
  <text x="40" y="65" font-family="'IBM Plex Sans','Segoe UI',sans-serif" font-size="12.5" fill="#6B7A87">GET /api/products — the generic shape, with the actual tech in brackets</text>

  <!-- role row y=140..280, four equal columns -->
  <!-- 1. Client -->
  <g filter="url(#card-shadow)">
    <rect x="40" y="150" width="230" height="150" rx="10" fill="#FFFFFF" stroke="#D8DEE3" stroke-width="1.2"></rect>
  </g>
  <text x="155" y="185" text-anchor="middle" font-family="'IBM Plex Sans',sans-serif" font-size="15" font-weight="700" fill="#16212C">Client</text>
  <text x="155" y="204" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="10.5" fill="#8A97A2">(Browser)</text>
  <line x1="60" y1="216" x2="250" y2="216" stroke="#E4E9ED" stroke-width="1"></line>
  <text x="155" y="240" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="11" fill="#6B7A87">GET /api/products</text>
  <text x="155" y="266" text-anchor="middle" font-family="'IBM Plex Sans',sans-serif" font-size="9.5" font-style="italic" fill="#8A97A2">asks for data</text>

  <!-- 2. Web server -->
  <g filter="url(#card-shadow)">
    <rect x="320" y="150" width="230" height="150" rx="10" fill="#FBF1E7" stroke="#E9C8A0" stroke-width="1.4"></rect>
  </g>
  <text x="435" y="185" text-anchor="middle" font-family="'IBM Plex Sans',sans-serif" font-size="15" font-weight="700" fill="#7A3E12">Web server</text>
  <text x="435" y="204" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="10.5" fill="#9C6A3A">(Nginx)</text>
  <line x1="340" y1="216" x2="530" y2="216" stroke="#EDDDC5" stroke-width="1"></line>
  <text x="435" y="238" text-anchor="middle" font-family="'IBM Plex Sans',sans-serif" font-size="10.5" fill="#8A5222">routes by path:</text>
  <text x="435" y="256" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="10" fill="#7A3E12">/ → static file</text>
  <text x="435" y="272" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="10" fill="#7A3E12">/api/ → forward on</text>

  <!-- 3. Application server -->
  <g filter="url(#card-shadow)">
    <rect x="600" y="150" width="270" height="150" rx="10" fill="#FBF1E7" stroke="#E9C8A0" stroke-width="1.4"></rect>
  </g>
  <text x="735" y="185" text-anchor="middle" font-family="'IBM Plex Sans',sans-serif" font-size="15" font-weight="700" fill="#7A3E12">Application server</text>
  <text x="735" y="204" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="10.5" fill="#9C6A3A">(Spring Boot · Tomcat · Hibernate)</text>
  <line x1="620" y1="216" x2="860" y2="216" stroke="#EDDDC5" stroke-width="1"></line>
  <text x="735" y="238" text-anchor="middle" font-family="'IBM Plex Sans',sans-serif" font-size="10.5" fill="#8A5222">runs the business logic —</text>
  <text x="735" y="254" text-anchor="middle" font-family="'IBM Plex Sans',sans-serif" font-size="10.5" fill="#8A5222">decides what data to fetch,</text>
  <text x="735" y="270" text-anchor="middle" font-family="'IBM Plex Sans',sans-serif" font-size="10.5" fill="#8A5222">turns rows into JSON</text>

  <!-- 4. Database -->
  <g filter="url(#card-shadow)">
    <rect x="910" y="150" width="230" height="150" rx="10" fill="#FFFFFF" stroke="#D8DEE3" stroke-width="1.2"></rect>
  </g>
  <text x="1025" y="185" text-anchor="middle" font-family="'IBM Plex Sans',sans-serif" font-size="15" font-weight="700" fill="#16212C">Database</text>
  <text x="1025" y="204" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="10.5" fill="#8A97A2">(Postgres)</text>
  <line x1="930" y1="216" x2="1120" y2="216" stroke="#E4E9ED" stroke-width="1"></line>
  <text x="1025" y="240" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="11" fill="#6B7A87">products (id, name, price)</text>
  <text x="1025" y="266" text-anchor="middle" font-family="'IBM Plex Sans',sans-serif" font-size="9.5" font-style="italic" fill="#8A97A2">stores &amp; returns rows</text>

  <!-- forward arrows (top of cards) -->
  <line x1="270" y1="200" x2="313" y2="200" stroke="#B45A1F" stroke-width="1.8" marker-end="url(#arrow)"></line>
  <line x1="550" y1="200" x2="593" y2="200" stroke="#B45A1F" stroke-width="1.8" marker-end="url(#arrow)"></line>
  <line x1="870" y1="200" x2="903" y2="200" stroke="#B45A1F" stroke-width="1.8" marker-end="url(#arrow)"></line>

  <!-- return arrows (bottom, the response coming back) -->
  <line x1="903" y1="335" x2="877" y2="335" stroke="#8FA0AF" stroke-width="1.5" marker-end="url(#arrow-return)"></line>
  <line x1="593" y1="335" x2="557" y2="335" stroke="#8FA0AF" stroke-width="1.5" marker-end="url(#arrow-return)"></line>
  <line x1="313" y1="335" x2="277" y2="335" stroke="#8FA0AF" stroke-width="1.5" marker-end="url(#arrow-return)"></line>
  <path d="M 1025 300 L 1025 335 L 910 335" fill="none" stroke="#8FA0AF" stroke-width="1.5"></path>
  <path d="M 735 300 L 735 335 L 630 335" fill="none" stroke="#8FA0AF" stroke-width="1.5"></path>
  <path d="M 435 300 L 435 335 L 350 335" fill="none" stroke="#8FA0AF" stroke-width="1.5"></path>
  <path d="M 155 300 L 155 335 L 70 335" fill="none" stroke="#8FA0AF" stroke-width="1.5"></path>
  <text x="605" y="357" text-anchor="middle" font-family="'IBM Plex Sans',sans-serif" font-size="11" fill="#6B7A87">response traverses back the same way — rows out, JSON to the client</text>

  <!-- legend -->
  <line x1="40" y1="420" x2="66" y2="420" stroke="#B45A1F" stroke-width="1.8" marker-end="url(#arrow)"></line>
  <text x="76" y="424" font-family="'IBM Plex Sans',sans-serif" font-size="11" fill="#7A3E12">request, forwarding</text>
  <line x1="230" y1="420" x2="256" y2="420" stroke="#8FA0AF" stroke-width="1.5" marker-end="url(#arrow-return)"></line>
  <text x="266" y="424" font-family="'IBM Plex Sans',sans-serif" font-size="11" fill="#6B7A87">response, returning</text>
</svg>
