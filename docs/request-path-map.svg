<svg viewBox="0 0 1240 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram showing a browser request reaching Nginx on port 80, which either serves static files directly from location slash, or strips the /api/ prefix and proxies to Spring Boot's embedded Tomcat on port 8080, which routes through DispatcherServlet to a RestController, then through a Repository to Postgres, with TablePlus connecting to Postgres separately for admin access.">
  <defs>
    <marker id="arrow-done" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52616F"></path>
    </marker>
    <marker id="arrow-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F7A52"></path>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="660" fill="#FFFFFF"></rect>

  <!-- Browser -->
  <rect x="20" y="270" width="130" height="64" rx="4" fill="#FFFFFF" stroke="#1B2733" stroke-width="1.5"></rect>
  <text x="85" y="296" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="13" font-weight="600" fill="#1B2733">Browser</text>
  <text x="85" y="314" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" fill="#7C8B98">localhost</text>

  <line x1="150" y1="302" x2="228" y2="302" stroke="#52616F" stroke-width="1.5" marker-end="url(#arrow-done)"></line>
  <text x="189" y="292" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="10.5" fill="#7C8B98">GET :80</text>

  <!-- Nginx outer box -->
  <rect x="230" y="60" width="230" height="520" rx="4" fill="#FFFFFF" stroke="#1B2733" stroke-width="1.5"></rect>
  <text x="345" y="86" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="13" font-weight="700" fill="#1B2733">nginx :80</text>
  <text x="345" y="102" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="10.5" fill="#7C8B98">nginx.conf &#183; server{}</text>

  <!-- location / -->
  <rect x="250" y="130" width="190" height="90" rx="3" fill="#EDF1F5" stroke="#B9C6D1" stroke-width="1"></rect>
  <text x="345" y="152" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11.5" font-weight="600" fill="#1B2733">location /</text>
  <text x="345" y="170" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="10" fill="#52616F">root server/</text>
  <text x="345" y="184" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="10" fill="#52616F">index index.html</text>

  <!-- location /api/ -->
  <rect x="250" y="440" width="190" height="110" rx="3" fill="#EDF1F5" stroke="#B9C6D1" stroke-width="1"></rect>
  <text x="345" y="463" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11.5" font-weight="600" fill="#1B2733">location /api/</text>
  <text x="345" y="481" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9.8" fill="#52616F">proxy_pass</text>
  <text x="345" y="495" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9.8" fill="#52616F">localhost:8080/</text>
  <text x="345" y="513" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9.5" fill="#7C8B98">strips /api/ prefix</text>

  <path d="M 230 302 L 210 302 L 210 175 L 250 175" fill="none" stroke="#52616F" stroke-width="1.2"></path>
  <path d="M 210 302 L 210 495 L 250 495" fill="none" stroke="#52616F" stroke-width="1.2"></path>

  <!-- static files -->
  <rect x="500" y="128" width="150" height="94" rx="4" fill="#FFFFFF" stroke="#1B2733" stroke-width="1.5"></rect>
  <text x="575" y="154" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="12" font-weight="600" fill="#1B2733">server/</text>
  <text x="575" y="172" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="10.5" fill="#52616F">index.html</text>
  <text x="575" y="186" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="10.5" fill="#52616F">style.css</text>
  <text x="575" y="200" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="10.5" fill="#52616F">script.js</text>

  <line x1="440" y1="175" x2="493" y2="175" stroke="#52616F" stroke-width="1.5" marker-end="url(#arrow-done)"></line>
  <text x="466" y="165" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9.5" fill="#7C8B98">file read</text>

  <line x1="440" y1="495" x2="640" y2="495" stroke="#52616F" stroke-width="1.5" marker-end="url(#arrow-done)"></line>
  <text x="540" y="485" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9.5" fill="#7C8B98">forward /hello, /products</text>

  <!-- Spring Boot process boundary -->
  <rect x="645" y="380" width="330" height="240" rx="4" fill="#FFFFFF" stroke="#1B2733" stroke-width="1.5" stroke-dasharray="5 3"></rect>
  <text x="810" y="404" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="12" font-weight="700" fill="#1B2733">spring boot process &#183; :8080</text>

  <rect x="665" y="422" width="130" height="60" rx="3" fill="#EDF1F5" stroke="#B9C6D1" stroke-width="1"></rect>
  <text x="730" y="448" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" font-weight="600" fill="#1B2733">Tomcat</text>
  <text x="730" y="463" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9.5" fill="#7C8B98">embedded</text>

  <line x1="795" y1="452" x2="820" y2="452" stroke="#52616F" stroke-width="1.3" marker-end="url(#arrow-done)"></line>

  <rect x="820" y="422" width="140" height="60" rx="3" fill="#EDF1F5" stroke="#B9C6D1" stroke-width="1"></rect>
  <text x="890" y="446" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="10.5" font-weight="600" fill="#1B2733">Dispatcher</text>
  <text x="890" y="460" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="10.5" font-weight="600" fill="#1B2733">Servlet</text>

  <line x1="890" y1="482" x2="890" y2="505" stroke="#52616F" stroke-width="1.3" marker-end="url(#arrow-done)"></line>
  <text x="915" y="497" text-anchor="start" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9" fill="#7C8B98">route by</text>
  <text x="915" y="508" text-anchor="start" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9" fill="#7C8B98">@GetMapping</text>

  <rect x="750" y="512" width="180" height="66" rx="3" fill="#DCEDE2" stroke="#2F7A52" stroke-width="1.3"></rect>
  <text x="840" y="538" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" font-weight="700" fill="#1B2733">RestController</text>
  <text x="840" y="555" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9.5" fill="#52616F">HelloController</text>
  <text x="840" y="568" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9.5" fill="#52616F">ProductController</text>

  <line x1="930" y1="545" x2="1005" y2="545" stroke="#2F7A52" stroke-width="1.5" marker-end="url(#arrow-ok)"></line>

  <!-- Repository -->
  <rect x="1005" y="500" width="150" height="94" rx="4" fill="#DCEDE2" stroke="#2F7A52" stroke-width="1.5"></rect>
  <text x="1080" y="524" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" font-weight="600" fill="#1B2733">Repository</text>
  <text x="1080" y="540" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9.5" fill="#52616F">JpaRepository</text>
  <text x="1080" y="556" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9.5" fill="#52616F">GET /products</text>
  <text x="1080" y="580" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9" fill="#2F7A52">Hibernate-backed</text>

  <line x1="1080" y1="500" x2="1080" y2="270" stroke="#2F7A52" stroke-width="1.5" marker-end="url(#arrow-ok)"></line>
  <text x="1096" y="390" text-anchor="start" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9" fill="#2F7A52">JDBC</text>
  <text x="1096" y="401" text-anchor="start" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9" fill="#2F7A52">query</text>

  <!-- DB -->
  <rect x="1000" y="150" width="160" height="110" rx="4" fill="#DCEDE2" stroke="#2F7A52" stroke-width="1.5"></rect>
  <text x="1080" y="178" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="12" font-weight="700" fill="#1B2733">Postgres</text>
  <text x="1080" y="194" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9.5" fill="#52616F">via DBngin</text>
  <text x="1080" y="212" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9.5" fill="#52616F">products table</text>
  <text x="1080" y="244" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9" fill="#2F7A52">:5432</text>

  <!-- TablePlus -->
  <rect x="1000" y="30" width="160" height="60" rx="4" fill="#FFFFFF" stroke="#B9C6D1" stroke-width="1.2"></rect>
  <text x="1080" y="55" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" font-weight="600" fill="#52616F">TablePlus</text>
  <text x="1080" y="71" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9.5" fill="#7C8B98">GUI, admin access</text>
  <line x1="1080" y1="90" x2="1080" y2="147" stroke="#7C8B98" stroke-width="1.2" stroke-dasharray="2 3"></line>
</svg>
